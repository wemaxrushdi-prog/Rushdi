<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10162e">
  <title>Rushdi · Digital Card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{font-family:"DM Sans",sans-serif;color:#172038;background:#eef1f8}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 8% 15%,#dce6ff,transparent 32%),radial-gradient(circle at 91% 85%,#e5dffb,transparent 34%),#f3f5fb}button,input,textarea{font:inherit}button{cursor:pointer}h1,h2,.logo{font-family:Outfit,sans-serif}.shell{width:min(100% - 32px,440px);margin:34px auto 50px}.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:17px;color:#62708b;font-size:13px;font-weight:700}.logo{color:#1c2540;font-size:17px;font-weight:800;letter-spacing:-.05em}.logo b{color:#6455ed}.edit-button{border:1px solid #dce1ed;background:#fff;color:#35415c;padding:9px 14px;border-radius:12px;font-weight:700}.card{overflow:hidden;background:#fff;border-radius:28px;box-shadow:0 24px 75px #34406820,0 3px 15px #3440680b}.cover{position:relative;height:176px;overflow:hidden;background:linear-gradient(125deg,#141d43,#4f45b1 57%,#9c77e9)}.cover:before,.cover:after{content:"";position:absolute;border:1px solid #ffffff26;border-radius:50%}.cover:before{width:330px;height:330px;right:-115px;top:-187px;box-shadow:0 0 0 40px #ffffff08,0 0 0 100px #ffffff06}.cover:after{width:170px;height:170px;left:-85px;bottom:-135px;box-shadow:0 0 0 45px #ffffff0b}.cover-label{position:absolute;top:22px;left:24px;color:#f1edff;font-size:11px;font-weight:700;letter-spacing:.17em;text-transform:uppercase}.spark{position:absolute;right:25px;bottom:33px;color:#ffffffad;font-size:32px}.profile{padding:0 27px 29px}.avatar-wrap{position:relative;margin-top:-57px;width:114px;height:114px;padding:5px;border-radius:31px;background:#fff;box-shadow:0 6px 22px #1e255a23}.avatar{width:100%;height:100%;border-radius:26px;display:grid;place-items:center;background:linear-gradient(145deg,#d8d3fc,#bbb2f9);color:#393186;font:800 32px Outfit,sans-serif;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.status{position:absolute;right:-3px;bottom:4px;width:22px;height:22px;background:#37c796;border:4px solid #fff;border-radius:50%}.eyebrow{margin:23px 0 7px;color:#7666df;font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}h1{margin:0;font-size:31px;line-height:1.1;letter-spacing:-.045em} .role{margin:9px 0 0;font-size:14px;color:#78839a}.divider{height:1px;background:#edf0f5;margin:25px 0}.details{display:grid;gap:17px}.detail{display:flex;align-items:center;gap:13px;min-width:0}.icon{width:42px;height:42px;flex:0 0 42px;display:grid;place-items:center;background:#f3f2ff;color:#6556df;border-radius:13px}.icon svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.detail small{display:block;color:#96a0b2;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}.detail a,.detail span{display:block;margin-top:3px;color:#2b344a;text-decoration:none;font-size:14px;font-weight:700;overflow-wrap:anywhere}.detail a:hover{color:#6656df}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:28px}.action{display:flex;justify-content:center;align-items:center;gap:8px;text-decoration:none;border-radius:13px;padding:14px 8px;font-size:13px;font-weight:800;border:1px solid #e5e8f1;color:#34405d;background:#fff}.action.primary{background:#6254e8;color:white;border-color:#6254e8;box-shadow:0 8px 20px #6254e832}.action:hover{filter:brightness(.97)}.bottom{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:16px 26px;background:#f8f9fd;border-top:1px solid #f0f1f6;color:#8894aa;font-size:11px;font-weight:700}.bottom button{border:0;background:transparent;color:#6a5ce8;font-size:11px;font-weight:800}.hint{text-align:center;color:#8994a8;font-size:12px;line-height:1.6;margin:19px 14px}.modal-backdrop{position:fixed;inset:0;z-index:5;background:#12182c99;display:none;align-items:center;justify-content:center;padding:15px}.modal-backdrop.open{display:flex}.modal{width:min(100%,440px);max-height:90vh;overflow:auto;background:white;border-radius:22px;padding:24px;box-shadow:0 20px 80px #10162e55}.modal h2{margin:0 0 4px;font-size:23px}.modal p{margin:0 0 20px;color:#7d889f;font-size:12px;line-height:1.5}.field{display:block;font-size:12px;font-weight:800;color:#546079;margin:12px 0}.field input,.field textarea{display:block;width:100%;margin-top:6px;padding:11px 12px;border:1px solid #dfe4ef;border-radius:10px;color:#25304b;background:#fff;outline:none}.field input:focus,.field textarea:focus{border-color:#6859e8}.modal-actions{display:flex;gap:9px;margin-top:20px}.modal-actions button{flex:1;padding:12px;border-radius:11px;font-weight:800;border:1px solid #e1e5ed;background:white}.modal-actions button[type=submit]{background:#6254e8;border-color:#6254e8;color:white}.notice{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#202a43;color:white;border-radius:12px;padding:11px 16px;font-size:12px;opacity:0;pointer-events:none;transition:opacity .2s;text-align:center;width:max-content;max-width:calc(100% - 32px)}.notice.show{opacity:1}@media(max-width:420px){.shell{margin-top:18px}.cover{height:160px}.profile{padding-inline:22px}h1{font-size:28px}} 
  </style>
</head>
<body>
  <main class="shell">
    <article class="card" aria-label="Digital contact card">
      <div class="cover"><span class="cover-label">Digital contact card</span><span class="spark">✳</span></div>
      <div class="profile">
        <div class="avatar-wrap"><div class="avatar" id="avatar">RA</div><span class="status"></span></div>
        <p class="eyebrow">Nice to meet you</p>
        <h1 id="displayName">Rushdi</h1>
        <p class="role" id="displayRole">Software Developer</p>
        <div class="divider"></div>
        <div class="details">
          <div class="detail"><span class="icon"><svg viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 2 .7 2.9a2 2 0 0 1-.5 2.1L8 10a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c.9.3 1.9.6 2.9.7A2 2 0 0 1 22 16.9z"/></svg></span><div><small>Phone number</small><a id="displayPhone" href="tel:+8801700000000">+880 1700 000000</a></div></div>
          <div class="detail"><span class="icon"><svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="3"/><path d="m3 6 9 7 9-7"/></svg></span><div><small>Email address</small><a id="displayEmail" href="mailto:aburushed@gmail.com">aburushed@gmail.com</a></div></div>
          <div class="detail"><span class="icon"><svg viewBox="0 0 24 24"><path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0z"/><circle cx="12" cy="10" r="2.5"/></svg></span><div><small>Address</small><span id="displayAddress">Mirpur, Dhaka, Bangladesh</span></div></div>
        </div>
        <div class="actions"><a class="action primary" id="callButton" href="tel:+8801700000000">↗ &nbsp;Call me</a><button class="action" id="saveContact" type="button">＋ &nbsp;Save contact</button></div>
      </div>
      <div class="bottom"><span>Let's stay connected ✦</span><button id="shareButton" type="button">Share card ↗</button></div>
    </article>
  </main>
  <div class="notice" id="notice" role="status"></div>
  <script>
    const defaults={name:"Rushdi",role:"Software Developer",phone:"+880 1700 000000",email:"aburushed@gmail.com",address:"Uttara, Dhaka, Bangladesh",photo:""};
    let data; try{data={...defaults,...JSON.parse(localStorage.getItem("nfc-card-v1")||"{}")}}catch{data={...defaults}}
    const $=id=>document.getElementById(id);
    function render(){
      $("displayName").textContent=data.name;
      $("displayRole").textContent=data.role;
      $("displayPhone").textContent=data.phone;
      $("displayPhone").href=$("callButton").href="tel:"+data.phone.replace(/[^+0-9]/g,"");
      $("displayEmail").textContent=data.email;
      $("displayEmail").href="mailto:"+data.email;
      $("displayAddress").textContent=data.address;
      const avatar=$("avatar");avatar.replaceChildren();
      if(data.photo){const img=document.createElement("img");img.src=data.photo;img.alt=data.name+" profile photo";avatar.append(img)}
      else avatar.textContent=data.name.trim().split(/\s+/).slice(0,2).map(w=>w[0]?.toUpperCase()).join("")||"ME";
      document.title=data.name+" · Digital Card";
    }
    render();
    function notify(text){$("notice").textContent=text;$("notice").classList.add("show");setTimeout(()=>$("notice").classList.remove("show"),3500)}
    $("editButton").onclick=()=>{for(const key of ["name","role","phone","email","address"])$("editForm").elements[key].value=data[key];$("photoInput").value="";$("modalBackdrop").classList.add("open")};
    $("cancelEdit").onclick=()=> $("modalBackdrop").classList.remove("open");
    $("modalBackdrop").onclick=e=>{if(e.target===$("modalBackdrop"))$("modalBackdrop").classList.remove("open")};
    document.addEventListener("keydown",e=>{if(e.key==="Escape")$("modalBackdrop").classList.remove("open")});
    $("editForm").onsubmit=async e=>{
      e.preventDefault();const form=e.currentTarget;const next={...data};
      for(const key of ["name","role","phone","email","address"])next[key]=form.elements[key].value.trim();
      const file=$("photoInput").files[0];
      if(file){if(file.size>2*1024*1024){notify("Please choose a photo smaller than 2 MB.");return}
        next.photo=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(file)});
      }
      try{localStorage.setItem("nfc-card-v1",JSON.stringify(next))}catch{notify("Photo too large to save on this device.");return}
      data=next;render();$("modalBackdrop").classList.remove("open");notify("Saved on this device.");
    };
    function escapeVcard(value){return String(value).replace(/\\/g,"\\\\").replace(/\n/g,"\\n").replace(/,/g,"\\,").replace(/;/g,"\\;")}
    $("saveContact").onclick=()=>{
      const vcard=["BEGIN:VCARD","VERSION:3.0","FN:"+escapeVcard(data.name),"TITLE:"+escapeVcard(data.role),"TEL;TYPE=CELL:"+data.phone.replace(/[^+0-9]/g,""),"EMAIL:"+data.email,"ADR;TYPE=WORK:;;"+escapeVcard(data.address)+";;;;","END:VCARD"].join("\r\n");
      const url=URL.createObjectURL(new Blob([vcard],{type:"text/vcard;charset=utf-8"}));
      const a=document.createElement("a");a.href=url;a.download=(data.name.toLowerCase().replace(/[^a-z0-9]+/g,"-")||"contact")+".vcf";document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
    };
    $("shareButton").onclick=async()=>{try{if(navigator.share){await navigator.share({title:data.name+" · Digital Card",url:location.href})}else if(navigator.clipboard&&location.protocol!=="file:"){await navigator.clipboard.writeText(location.href);notify("Card link copied.")}else notify("Publish this page online first to share its link.")}catch(e){if(e.name!=="AbortError")notify("Could not share this card.")}};
  </script>
</body>
</html>
